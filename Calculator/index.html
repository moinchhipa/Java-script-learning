<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.0/css/all.min.css"
        integrity="sha512-DxV+EoADOkOygM4IR9yXP8Sb2qwgidEmeqAEmDKIOfPRQZOWbXCzLC6vjbZyy0vPisbH2SyW27+ddLVCN+OMzQ=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
        <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
</head>

<body>
    <div class="main">
        <div class="container">
            <div class="screen">0</div>
            <div class="buttons">
                <div class="row_1 row">
                    <div class="clear btn">AC</div>
                    <div class="back btn">←</div>
                    <div class="div btn ope">/</div>
                </div>
                <div class="row_2 row">
                    <div class="one btn num">1</div>
                    <div class="two btn num">2</div>
                    <div class="three btn num">3</div>
                    <div class="mul btn ope">*</div>
                </div>
                <div class="row_3 row">
                    <div class="four btn num">4</div>
                    <div class="five btn num">5</div>
                    <div class="six btn num">6</div>
                    <div class="sub btn ope">-</div>
                </div>
                <div class="row_4 row">
                    <div class="seven btn num">7</div>
                    <div class="eight btn num">8</div>
                    <div class="nine btn num">9</div>
                    <div class="add btn ope">+</div>
                </div>
                <div class="row_5 row">
                    <div class="zero btn num">0</div>
                    <div class="dZero btn num">00</div>
                    <div class="dot btn num">.</div>
                    <div class="equ btn">=</div>
                </div>
            </div>
        </div>

        <script src="app.js"></script>
</body>

</html>
